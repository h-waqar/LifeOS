<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Inner Interconnected Structure -->
  <g filter="url(#glow)">
    <!-- Connecting Edges -->
    <line x1="256" y1="160" x2="340" y2="305" stroke="#8b5cf6" stroke-width="6" opacity="0.8" />
    <line x1="340" y1="305" x2="172" y2="305" stroke="#3b82f6" stroke-width="6" opacity="0.8" />
    <line x1="172" y1="305" x2="256" y2="160" stroke="#ec4899" stroke-width="6" opacity="0.8" />
    <line x1="256" y1="160" x2="256" y2="256" stroke="#ffffff" stroke-width="4" opacity="0.7" />
    <line x1="340" y1="305" x2="256" y2="256" stroke="#ffffff" stroke-width="4" opacity="0.7" />
    <line x1="172" y1="305" x2="256" y2="256" stroke="#ffffff" stroke-width="4" opacity="0.7" />

    <!-- Core Central Node -->
    <circle cx="256" cy="256" r="32" fill="url(#coreGrad)" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" />

    <!-- Satellite Nodes -->
    <!-- Top (Goals & Vision) -->
    <circle cx="256" cy="160" r="22" fill="#ec4899" />
    <circle cx="256" cy="160" r="10" fill="#ffffff" />

    <!-- Bottom Right (Execution & Tasks) -->
    <circle cx="340" cy="305" r="22" fill="#8b5cf6" />
    <circle cx="340" cy="305" r="10" fill="#ffffff" />

    <!-- Bottom Left (Knowledge & Memory) -->
    <circle cx="172" cy="305" r="22" fill="#3b82f6" />
    <circle cx="172" cy="305" r="10" fill="#ffffff" />
  </g>
</svg>
