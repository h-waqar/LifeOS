<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ringGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coreGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Outer Orbit Ring -->
  <circle cx="96" cy="96" r="52" fill="none" stroke="url(#ringGrad192)" stroke-width="3" stroke-dasharray="6 3" opacity="0.6" />

  <!-- Inner Interconnected Structure -->
  <g filter="url(#glow192)">
    <!-- Connecting Edges -->
    <line x1="96" y1="60" x2="128" y2="114" stroke="#8b5cf6" stroke-width="2.5" opacity="0.8" />
    <line x1="128" y1="114" x2="64" y2="114" stroke="#3b82f6" stroke-width="2.5" opacity="0.8" />
    <line x1="64" y1="114" x2="96" y2="60" stroke="#ec4899" stroke-width="2.5" opacity="0.8" />
    <line x1="96" y1="60" x2="96" y2="96" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <line x1="128" y1="114" x2="96" y2="96" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <line x1="64" y1="114" x2="96" y2="96" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />

    <!-- Core Central Node -->
    <circle cx="96" cy="96" r="12" fill="url(#coreGrad192)" />
    <circle cx="96" cy="96" r="5" fill="#ffffff" />

    <!-- Satellite Nodes -->
    <!-- Top -->
    <circle cx="96" cy="60" r="8" fill="#ec4899" />
    <circle cx="96" cy="60" r="4" fill="#ffffff" />

    <!-- Bottom Right -->
    <circle cx="128" cy="114" r="8" fill="#8b5cf6" />
    <circle cx="128" cy="114" r="4" fill="#ffffff" />

    <!-- Bottom Left -->
    <circle cx="64" cy="114" r="8" fill="#3b82f6" />
    <circle cx="64" cy="114" r="4" fill="#ffffff" />
  </g>
</svg>
